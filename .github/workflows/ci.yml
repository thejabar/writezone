name: CI

# Two jobs:
#
#   lint    - php -l over every first-party PHP file, on PHP 8.2 (the floor in
#             composer.json) and PHP 8.4.
#   migrate - runs database/migrations against a disposable MySQL 8.0.46
#             service container and asserts that the tables those migrations
#             create actually exist.
#
# The migrate job is a connectivity / smoke test only. It asserts `users` and
# `writs` because those are what the current migrations create; it does not
# claim the schema is complete enough for the application.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find app bootstrap config core database public_html resources routes \
              -type f -name '*.php'
            printf '%s\n' migrate.php
          )

          printf 'Linting %d files with PHP %s\n' "${#files[@]}" "$(php -r 'echo PHP_VERSION;')"

          for file in "${files[@]}"; do
            if ! output=$(php -l "$file"); then
              printf '%s\n' "$output"
              exit 1
            fi
          done

          echo 'All PHP files passed php -l.'

  migrate:
    name: Migrations (PHP 8.2, MySQL 8.0.46)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        # Version tag plus its multi-arch manifest-list digest.
        # Verified OCI image index for linux/amd64 and linux/arm64:
        # sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: writezone
          MYSQL_USER: writezone
          MYSQL_PASSWORD: writezone
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # migrate.php requires .env even though DB settings are supplied
      # through the GitHub Actions job environment. This file exists only
      # inside the temporary GitHub Actions workspace.
      - name: Create .env for the migrator
        run: |
          cat > .env <<'ENV'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=writezone
          DB_USERNAME=writezone
          DB_PASSWORD=writezone
          ENV

      # Connection.php uses die() on connection failure, which can exit 0.
      # Require the migrator's explicit completion message as an extra guard.
      - name: Run migrations
        run: |
          set -euo pipefail

          output=$(php migrate.php migrate)
          printf '%s\n' "$output"

          if ! grep -Eq '^(Fresh database baseline applied|Migration run completed)\.$' <<< "$output"; then
            echo '::error::php migrate.php migrate did not report a recognised success state'
            exit 1
          fi

      - name: "Verify migration connectivity (smoke test: users, writs)"
        run: |
          php <<'PHP'
          <?php

          declare(strict_types=1);

          // Smoke test only. This does not establish application schema
          // completeness. The application also expects users.handle,
          // writs.public_id, comments, comment_votes, follows, bookmarks
          // and notifications.

          define('BASE_PATH', getcwd());

          require BASE_PATH . '/vendor/autoload.php';

          Dotenv\Dotenv::createImmutable(BASE_PATH)->load();

          $config = require BASE_PATH . '/config/database.php';

          $dsn = sprintf(
              '%s:host=%s;port=%d;dbname=%s;charset=%s',
              $config['driver'],
              $config['host'],
              $config['port'],
              $config['database'],
              $config['charset']
          );

          $pdo = new PDO(
              $dsn,
              $config['username'],
              $config['password'],
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
          );

          $tables = $pdo->query('SHOW TABLES')->fetchAll(PDO::FETCH_COLUMN);

          sort($tables);

          echo 'Tables: ', implode(', ', $tables), PHP_EOL;

          $missing = array_diff(['users', 'writs'], $tables);

          if ($missing !== []) {
              fwrite(STDERR, 'Missing tables: ' . implode(', ', $missing) . PHP_EOL);
              exit(1);
          }

          echo 'Migrations created the expected tables (users, writs).', PHP_EOL;
          PHP
